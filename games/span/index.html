<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Span</title>
  <meta name="theme-color" content="#101b31" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Build bridges that hold. A blueprint-clean, fully offline bridge builder." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Span" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />

  <!-- avoid flash of unstyled background -->
  <style>html{background:#0a0a0f}</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-back" type="button" aria-label="Back to levels">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="level-title">
        <span class="num" id="level-num">Level 1</span>
        <span class="name" id="level-name">First Span</span>
      </div>
      <div class="chip" id="budget-chip">
        <span class="chip-label">Budget</span>
        <span class="chip-value" id="budget">0</span>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Bridge construction site" role="application" tabindex="0"></canvas>
      <p class="intro-line" id="intro"></p>

      <div class="overlay" id="result" data-kind="win" hidden>
        <div class="overlay-card">
          <div class="overlay-title" id="result-title">It holds!</div>
          <p class="overlay-sub" id="result-sub"></p>
          <div class="btn-row">
            <button class="btn" id="result-secondary" type="button">Improve</button>
            <button class="btn primary" id="result-primary" type="button">Next level</button>
          </div>
          <div class="overlay-hint"><span class="if-touch" id="result-hint-touch"></span><span class="if-key" id="result-hint-key"></span></div>
        </div>
      </div>

      <div class="overlay menu" id="menu">
        <div class="menu-card">
          <h1 class="menu-title">Span</h1>
          <p class="menu-tag">Build bridges that hold.</p>
          <div class="levels" id="levels"></div>
          <p class="menu-hint">
            <span class="if-touch">Drag between nodes to build. Tap a beam to remove it.</span>
            <span class="if-key">Drag to build &middot; 1&ndash;4 pick material &middot; E erase &middot; Space test &middot; R reset</span>
          </p>
          <button class="install-btn" id="install" type="button" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Add to Home Screen</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="controls" id="controls">
      <div class="palette" id="palette">
        <button class="mat-btn sel" data-mat="road" type="button" style="--mat: var(--road)">
          <span class="key-hint if-key">1</span>
          <span class="swatch"></span>
          <span class="mat-name">Road</span>
          <span class="mat-cost">$16/m</span>
        </button>
        <button class="mat-btn" data-mat="wood" type="button" style="--mat: var(--wood)">
          <span class="key-hint if-key">2</span>
          <span class="swatch"></span>
          <span class="mat-name">Wood</span>
          <span class="mat-cost">$12/m</span>
        </button>
        <button class="mat-btn" data-mat="steel" type="button" style="--mat: var(--steel)">
          <span class="key-hint if-key">3</span>
          <span class="swatch"></span>
          <span class="mat-name">Steel</span>
          <span class="mat-cost">$30/m</span>
        </button>
        <button class="mat-btn" data-mat="cable" type="button" style="--mat: var(--cable)">
          <span class="key-hint if-key">4</span>
          <span class="swatch"></span>
          <span class="mat-name">Cable</span>
          <span class="mat-cost">$8/m</span>
        </button>
        <button class="tool-btn" id="btn-erase" type="button" aria-label="Erase beams">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 15 13 6a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18H7l-3-3Z M7 18h13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Erase</span>
        </button>
        <button class="tool-btn" id="btn-reset" type="button" aria-label="Reset level">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 10a8 8 0 1 1-1 5M4 10V4m0 6h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Reset</span>
        </button>
      </div>
      <button class="primary-btn" id="btn-test" type="button">Test</button>
      <button class="primary-btn stop" id="btn-stop" type="button" hidden>Stop</button>
    </footer>

    <div class="install-tip" id="install-tip" hidden>
      <div class="install-tip-card">
        <p>Install this app: tap the <strong>Share</strong> button
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v12M12 3 8 7m4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        in your browser, then <strong>Add to Home Screen</strong>.</p>
        <button class="btn" id="install-tip-close" type="button">Got it</button>
      </div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
