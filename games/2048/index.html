<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>2048</title>
  <meta name="theme-color" content="#1a1408" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A minimal, offline 2048." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2048" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />

  <!-- avoid flash of unstyled background -->
  <style>html{background:#0a0a0f}</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-row">
        <h1 class="title">2048</h1>
        <div class="stats">
          <div class="chip">
            <span class="chip-label">Score</span>
            <span class="chip-value" id="score">0</span>
          </div>
          <div class="chip">
            <span class="chip-label">Best</span>
            <span class="chip-value" id="best">0</span>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="undo" type="button" aria-label="Undo last move" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a4 4 0 0 1 0 8h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Undo</span>
        </button>
        <button class="btn btn-primary" id="new-game" type="button" aria-label="New game">
          New Game
        </button>
      </div>
    </header>

    <main class="board-wrap">
      <div class="board" id="board" aria-label="2048 board" role="application" tabindex="0">
        <div class="grid" id="grid" aria-hidden="true"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <div class="overlay-title" id="overlay-title">You win</div>
            <div class="overlay-sub" id="overlay-sub"></div>
            <div class="overlay-actions" id="overlay-actions"></div>
          </div>
        </div>
      </div>
    </main>

    <p class="hint">Swipe or use arrow keys / WASD. Merge tiles to reach 2048.</p>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
