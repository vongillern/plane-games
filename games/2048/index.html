<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>2048</title>
  <meta name="theme-color" content="#1a1408" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A minimal, offline 2048." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2048" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />

  <!-- avoid flash of unstyled background -->
  <style>html{background:#0a0a0f}</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="stats">
        <div class="chip">
          <span class="chip-label">Score</span>
          <span class="chip-value" id="score">0</span>
        </div>
        <div class="chip">
          <span class="chip-label">Best</span>
          <span class="chip-value" id="best">0</span>
        </div>
      </div>
    </header>

    <main class="board-wrap">
      <div class="board" id="board" aria-label="2048 board" role="application" tabindex="0">
        <div class="grid" id="grid" aria-hidden="true"></div>
        <div class="tiles" id="tiles"></div>
        <div class="fx" id="fx" aria-hidden="true"></div>
        <div class="fx fx-labels" id="fx-labels" aria-hidden="true"></div>
        <div class="board-glow" id="board-glow" aria-hidden="true"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <div class="overlay-title" id="overlay-title">You win</div>
            <div class="overlay-sub" id="overlay-sub"></div>
            <div class="overlay-actions" id="overlay-actions"></div>
          </div>
        </div>
      </div>
    </main>

    <p class="hint"><span class="if-touch">Swipe to move.</span><span class="if-key">Arrow keys / WASD to move.</span> Merge tiles to reach 2048.</p>

    <button class="install-btn" id="install" type="button" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Add to Home Screen</span>
    </button>

    <div class="install-tip" id="install-tip" hidden>
      <div class="install-tip-card">
        <p>Install this app: tap the <strong>Share</strong> button
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v12M12 3 8 7m4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        in your browser, then <strong>Add to Home Screen</strong>.</p>
        <button class="btn" id="install-tip-close" type="button">Got it</button>
      </div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
