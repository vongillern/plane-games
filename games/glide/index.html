<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Glide</title>
  <meta name="theme-color" content="#170b10" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A serene night-flight paper plane game. Fully offline." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glide" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />

  <!-- avoid flash of unstyled background -->
  <style>html{background:#0a0a0f}</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="game"></canvas>

    <!-- In-play score -->
    <div class="score" id="score" aria-live="polite">0</div>

    <!-- Start overlay -->
    <div class="overlay" id="start-overlay">
      <div class="overlay-card">
        <h1 class="title">Glide</h1>
        <p class="tagline"><span class="if-touch">tap to stay aloft</span><span class="if-key">click to stay aloft</span></p>
        <div class="hint-row if-key">
          <span class="key">Click</span>
          <span class="key">Space</span>
        </div>
        <button class="install-btn" id="install" type="button" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Add to Home Screen</span></button>
      </div>
    </div>

    <!-- Game over overlay -->
    <div class="overlay" id="over-overlay" hidden>
      <div class="overlay-card">
        <p class="over-label">Grounded</p>
        <div class="scoreboard">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="final-score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="best-score">0</span>
          </div>
        </div>
        <p class="new-best" id="new-best" hidden>New best</p>
        <button class="btn btn-primary" id="restart" type="button">Fly again</button>
        <p class="restart-hint"><span class="if-touch">or tap anywhere</span><span class="if-key">Space or R to restart</span></p>
      </div>
    </div>
  </div>

  <div class="install-tip" id="install-tip" hidden>
    <div class="install-tip-card">
      <p>Install this app: tap the <strong>Share</strong> button
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v12M12 3 8 7m4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      in your browser, then <strong>Add to Home Screen</strong>.</p>
      <button id="install-tip-close" type="button">Got it</button>
    </div>
  </div>

  <script>
  (() => {
    const btn = document.getElementById('install');
    const tip = document.getElementById('install-tip');
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let deferred = null;
    addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferred = e;
      btn.hidden = false;
    });
    if (isIOS) btn.hidden = false;
    for (const el of [btn, tip]) {
      for (const t of ['pointerdown', 'pointerup', 'click']) {
        el.addEventListener(t, (e) => e.stopPropagation());
      }
    }
    btn.addEventListener('click', async () => {
      if (deferred) {
        deferred.prompt();
        const { outcome } = await deferred.userChoice;
        if (outcome === 'accepted') btn.hidden = true;
        deferred = null;
      } else {
        tip.hidden = false;
      }
    });
    document.getElementById('install-tip-close').addEventListener('click', () => { tip.hidden = true; });
    tip.addEventListener('click', (e) => { if (e.target === tip) tip.hidden = true; });
    addEventListener('appinstalled', () => { btn.hidden = true; });
  })();
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
