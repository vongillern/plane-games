<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Snake</title>
  <meta name="theme-color" content="#0a1410" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A smooth, offline Snake." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Snake" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />

  <!-- avoid flash of unstyled background -->
  <style>html{background:#0a0a0f}</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-row">
        <h1 class="title">Snake</h1>
        <div class="stats">
          <div class="chip">
            <span class="chip-label">Score</span>
            <span class="chip-value" id="score">0</span>
          </div>
          <div class="chip">
            <span class="chip-label">Best</span>
            <span class="chip-value" id="best">0</span>
          </div>
        </div>
      </div>
    </header>

    <main class="board-wrap">
      <div class="board" id="board" role="application" aria-label="Snake board" tabindex="0">
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="overlay-title" id="overlay-title">Snake</div>
            <div class="overlay-sub" id="overlay-sub"></div>
            <div class="overlay-hint" id="overlay-hint"></div>
            <button class="install-btn" id="install" type="button" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Add to Home Screen</span></button>
          </div>
        </div>
      </div>
    </main>

    <p class="hint"><span class="if-touch">Swipe on the board to steer.</span><span class="if-key">Steer with arrow keys / WASD.</span></p>
  </div>

  <div class="install-tip" id="install-tip" hidden>
    <div class="install-tip-card">
      <p>Install this app: tap the <strong>Share</strong> button
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v12M12 3 8 7m4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      in your browser, then <strong>Add to Home Screen</strong>.</p>
      <button id="install-tip-close" type="button">Got it</button>
    </div>
  </div>

  <script>
  (() => {
    const btn = document.getElementById('install');
    const tip = document.getElementById('install-tip');
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let deferred = null;
    addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferred = e;
      btn.hidden = false;
    });
    if (isIOS) btn.hidden = false;
    for (const el of [btn, tip]) {
      for (const t of ['pointerdown', 'pointerup', 'click']) {
        el.addEventListener(t, (e) => e.stopPropagation());
      }
    }
    btn.addEventListener('click', async () => {
      if (deferred) {
        deferred.prompt();
        const { outcome } = await deferred.userChoice;
        if (outcome === 'accepted') btn.hidden = true;
        deferred = null;
      } else {
        tip.hidden = false;
      }
    });
    document.getElementById('install-tip-close').addEventListener('click', () => { tip.hidden = true; });
    tip.addEventListener('click', (e) => { if (e.target === tip) tip.hidden = true; });
    addEventListener('appinstalled', () => { btn.hidden = true; });
  })();
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
